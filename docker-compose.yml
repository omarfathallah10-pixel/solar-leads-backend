services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: solarleads
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solarleads"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    # noeviction is REQUIRED. The default allkeys-lru silently evicts BullMQ job
    # data under memory pressure, losing queued emails with no error anywhere.
    command: valkey-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

volumes:
  pgdata:
  redisdata:
